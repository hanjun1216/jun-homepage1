<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>준의 홈페이지</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            margin-top: 12px;
            font-size: 18px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 16px;
        }

        h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <header>
        <h1>안녕, 나는 준이야.</h1>
        <p>나만의 웹사이트를 만들어보는 중!</p>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>여기에 나를 소개하는 글을 적어볼 거야.</p>
        </section>

        <section>
            <h2>Projects</h2>
            <p>앞으로 내가 만든 것들을 여기에 올릴 거야.</p>
        </section>

        <section>
            <h2>Contact</h2>
            <p>아직 준비 중.</p>
        </section>
    </main>

</body>
</html>
